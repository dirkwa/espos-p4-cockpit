version: 2
updates:
  # The release workflow pins every action to a commit SHA so a moved tag
  # can't reach a job that builds firmware and, in the release job, holds a
  # writable token. Dependabot understands SHA pins and rewrites them with
  # the tag in the comment, which is the only maintainable way to keep them
  # current — unpinning to floating tags would undo that hardening.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

# Not covered, deliberately:
#
# - pip (esptool in release-firmware.yml). Dependabot only reads
#   requirements/pyproject files, not `pip install` lines in a workflow, so
#   it cannot see that pin. It is exact-pinned with the reason inline:
#   esptool must stay <5 (merge_bin was renamed merge-bin and the esptool.py
#   entry point dropped). Bump it by hand and let the pull_request build
#   gate prove it.
#
# - The ESP-IDF component manager is not a Dependabot ecosystem. It is
#   covered instead by
#   .github/workflows/dependency-drift.yml, which re-resolves weekly against
#   the committed dependencies.lock and raises an issue when a newer version
#   is available. That is the half Dependabot would have done; taking the
#   update stays manual, because a component bump changes the binary that
#   goes on a boat.
