# Cuts releases from the history, the way espOS does: every push to main
# refreshes a "chore: release x.y.z" pull request carrying the changelog
# and the version.txt bump, and merging that PR tags and publishes the
# release. feat bumps minor, fix bumps patch, a `!` bumps major.
#
# A release created here is created with the workflow's own token, and
# GitHub never lets such an event start another workflow -- so the
# firmware build, signing and asset upload are called directly rather
# than left to release-firmware.yml's `release:` trigger.
#
# The release PR, though, is opened with a GitHub App's token
# (RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY): GitHub holds the checks of
# a PR opened with the workflow token until a maintainer approves them,
# while an App's PR runs them at once. So release-please runs twice, the
# release with the workflow token and the PR with the App's. A release
# published by the App would also fire the `release:` trigger and build
# the firmware a second time. Without the secrets the PR falls back to
# the workflow token, and its checks wait for approval.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # A flag, because a step's `if` cannot read secrets. Only the flag: the
      # key itself in the job environment would reach every step.
      APP_CONFIGURED: >-
        ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Get the App token for the release PR
        id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          token: ${{ steps.app-token.outputs.token || github.token }}

  firmware:
    needs: release-please
    # always(), because the release is already out by the time anything below it
    # can fail. The first release-please step creates it; the App token and the
    # PR-opening step come after, and a failure in either -- an expired key, a
    # misconfigured App, a bad minute at GitHub -- would fail the job and skip this
    # one on a plain `needs:`. That leaves a tagged release carrying no firmware,
    # which on this repository is a release carrying nothing at all: the binaries
    # ARE the release. Whether to build is answered by release_created, not by
    # whether opening a PR went well.
    if: always() && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-firmware.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
