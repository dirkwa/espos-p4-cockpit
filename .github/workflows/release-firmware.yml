name: Build & release firmware

on:
  # Called by release-please.yml once it has created a release: a release
  # made with the workflow token never fires the `release:` trigger below,
  # which stays for a release published by hand.
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build, sign and attach assets to"
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# One run per ref, so a new push to a branch cancels the run already in
# flight for it. A run that publishes keys on the release tag instead, so a
# branch push can never share its group and cancel it part-way through
# uploading the firmware assets -- half an asset set on a published release
# is the one state worth protecting here.
#
# The tag comes from inputs.tag when release-please calls this workflow and
# from the release event when someone publishes by hand; both spellings of
# the same release land in one group, and neither sits in the group of the
# branch they were called from.
#
# A publishing run is never cancelled, not even by another run of the same
# tag: re-running a failed upload, or publishing by hand while the called
# run is still going, would otherwise kill an upload half-way and leave the
# release carrying an incomplete asset set. Those queue instead.
concurrency:
  group: >-
    firmware-${{
      (inputs.tag || github.event.release.tag_name)
      && format('release-{0}', inputs.tag || github.event.release.tag_name)
      || github.ref
    }}
  cancel-in-progress: ${{ !(inputs.tag || github.event.release.tag_name) }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One image per panel. The boards are not interchangeable -- different
      # display controller, resolution, orientation and backlight/reset pins --
      # so a build serves exactly one, and flashing the other leaves the screen
      # black in a way that reads as dead hardware.
      #
      # fail-fast off so a failing board still reports its own error rather
      # than being cancelled mid-compile by the other leg: that is a debugging
      # convenience, NOT a partial-release policy. A release needs every
      # board's assets (`needs: build` skips the release job unless both legs
      # pass, and fail_on_unmatched_files catches a missing file), because a
      # half-published release is worse than none: the registry resolves
      # assets per board, so owners of the missing one would be offered a
      # version that has no image they can install.
      fail-fast: false
      matrix:
        include:
          - board: 7b
            kconfig: CONFIG_COCKPIT_BOARD_WAVESHARE_7B
            name: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
          - board: x7
            kconfig: CONFIG_COCKPIT_BOARD_WAVESHARE_LCD_X_7
            name: Waveshare ESP32-P4-WIFI6-Touch-LCD-X 7in
    env:
      # Non-empty for a release, whether called with a tag or published by
      # hand; empty for pull requests, pushes and manual builds.
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
    steps:
      # fetch-depth: 0 because the version this firmware reports comes from
      # `git describe`, and checkout's default depth of 1 fetches no tags at
      # all -- in either repository. Without it describe answers with a bare
      # hash, espos_version.cmake rejects that as not-a-version and falls back
      # to version.txt, and every build between two releases ships claiming to
      # BE that release: `1.1.0` rather than `1.1.0-11-g8533ab4`. The same
      # shallowness leaves the espOS submodule with zero tags, so the build log
      # cannot name which espOS is in the image either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # sdkconfig.local is the last defaults file espOS's prologue reads
      # (espos/cmake/espos_project.cmake), so one line here overrides the
      # Kconfig choice without touching tracked files. It is git-ignored, so
      # nothing in the tree records which board a build was for -- the asset
      # name and the firmware's own opts.board do.
      #
      # Without this override a build takes the Kconfig default, which is the
      # 7B: that is why release assets up to v1.2.0 carry no board in their
      # name and are all 7B images.
      - name: select the panel board
        env:
          KCONFIG: ${{ matrix.kconfig }}
        run: |
          case "$KCONFIG" in
            CONFIG_COCKPIT_BOARD_[A-Z0-9_]*) ;;
            *) echo "::error::refusing unexpected board symbol '$KCONFIG'"; exit 1 ;;
          esac
          printf '%s=y\n' "$KCONFIG" > sdkconfig.local
          cat sdkconfig.local

      # A throwaway signing key is generated by CMake when none is present;
      # release builds must instead restore the project's real key from a
      # secret (see espos/docs/ota.md) — devices only accept images signed
      # with the key whose public part they were flashed with.
      #
      # Fail rather than fall back: a release signed with a per-run throwaway
      # key installs fine over USB and then rejects every future OTA, on the
      # device, long after CI went green.
      - name: restore signing key (releases)
        id: signing
        if: env.RELEASE_TAG != ''
        env:
          KEY: ${{ secrets.COCKPIT_SIGNING_KEY_PEM }}
          ALLOW_UNSIGNED: ${{ vars.COCKPIT_ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -z "$KEY" ] && [ "$ALLOW_UNSIGNED" = "true" ]; then
            # Opt-out for forks that want a flashable binary and are not
            # running an OTA fleet. CMake generates a throwaway key, so the
            # release installs over USB and no device will ever accept an OTA
            # signed by a later build. Deliberate, and labelled as such in the
            # release notes rather than left for someone to discover on a boat.
            echo "::warning::COCKPIT_ALLOW_UNSIGNED_RELEASE is set: building" \
                 "with a throwaway signing key. USB flashing works; OTA" \
                 "updates will NOT."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "::error::COCKPIT_SIGNING_KEY_PEM is not set." \
                 "Releases are signed so devices can verify OTA updates;" \
                 "without a stable key an installed device could never be" \
                 "updated over the air again."
            echo "::error::To sign your releases, generate a key and add it" \
                 "as a repository secret:"
            echo "::error::  espsecure generate-signing-key --version 2" \
                 "--scheme rsa3072 signing_key.pem"
            echo "::error::  gh secret set COCKPIT_SIGNING_KEY_PEM < signing_key.pem"
            echo "::error::Keep that file safe: losing it means no existing" \
                 "device can take another OTA."
            echo "::error::To release without OTA support instead (USB" \
                 "flashing only), set repository variable" \
                 "COCKPIT_ALLOW_UNSIGNED_RELEASE=true. See espos/docs/ota.md."
            exit 1
          fi
          printf '%s' "$KEY" > secure_boot_signing_key.pem
          # A truncated or mangled secret would otherwise surface as a cryptic
          # CMake failure; check it is a usable RSA key before the 6-minute build.
          openssl rsa -in secure_boot_signing_key.pem -noout -check

      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1 branch head
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32p4
          command: idf.py build

      # Prove the override reached the build rather than trusting that it did.
      # A silently ignored sdkconfig.local would publish two identical 7B
      # images under two names, which is worse than not shipping the X at all:
      # the name would promise a board the image cannot drive.
      - name: Verify the built image is for this board
        env:
          KCONFIG: ${{ matrix.kconfig }}
        run: |
          if ! grep -qx "${KCONFIG}=y" build/config/sdkconfig.h 2>/dev/null \
             && ! grep -qx "#define ${KCONFIG} 1" build/config/sdkconfig.h; then
            echo "::error::${KCONFIG} is not set in the generated config --" \
                 "sdkconfig.local did not take effect"
            grep -E "^#define CONFIG_COCKPIT_BOARD" build/config/sdkconfig.h || true
            exit 1
          fi
          echo "built for ${KCONFIG}"

      # --require-model on releases: merging without srmodels.bin yields an
      # image whose on-device wake word is dead and which OTA cannot repair.
      - name: Merge flash images into one binary
        run: |
          pip install "esptool==4.8.1"
          python scripts/merge_firmware.py --build-dir build --chip esp32p4 \
            --out p4_cockpit-merged.bin \
            ${{ env.RELEASE_TAG != '' && '--require-model' || '' }}

      - name: Verify merged binary
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          data = Path("p4_cockpit-merged.bin").read_bytes()
          print(f"{len(data)} bytes ({len(data)/1024/1024:.2f} MiB)")
          if data[0x2000] != 0xE9:
              sys.exit(f"error: no ESP image magic at 0x2000 (got {data[0x2000]:#04x})")
          # The web UI is a separate LittleFS partition, so a missing or empty
          # one still yields a bootable image — the panel just serves espOS'
          # placeholder page instead of the config UI, which reads as a
          # firmware bug. The bundle is committed in
          # espos/components/espos_httpd/ui-dist, so a blank partition means a
          # damaged submodule checkout. Offsets track p4_16mb.csv.
          STORAGE = 0xD80000
          if len(data) <= STORAGE or data[STORAGE:STORAGE + 0x1000] == b"\xff" * 0x1000:
              sys.exit("error: storage partition missing or blank — the web UI "
                       "image was not merged (is espos/components/espos_httpd/ui-dist checked out?)")
          print("merged image looks structurally sound")
          PY

      # Stage both files in one flat dir: upload-artifact strips to the least
      # common ancestor, so uploading build/cockpit.bin alongside a top-level
      # file silently drops the build/ prefix the release job asked for.
      # The OTA asset carries the version because that is what a device is
      # pointed at by URL; the merged image is the USB/full-flash one.
      - name: Stage release assets
        if: env.RELEASE_TAG != '' || github.event_name == 'workflow_dispatch'
        env:
          # Via env, not ${{ }}: a tag name is arbitrary text and would
          # otherwise be pasted into this script before bash parses it.
          TAG: ${{ env.RELEASE_TAG }}
          BOARD: ${{ matrix.board }}
        run: |
          # Manual runs are not releases: tag them with the commit so two
          # dispatch builds are never indistinguishable on disk.
          VERSION="${TAG:-$(cat version.txt)-g$(git rev-parse --short HEAD)}"
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing unsafe tag '$VERSION'"; exit 1 ;;
          esac
          mkdir -p dist
          # The board is in the name because the images are not
          # interchangeable and a device cannot tell them apart: espOS matches
          # an OTA on app, target and channel, never on board. A name that
          # omits it is how a panel is sent firmware for a different display.
          cp p4_cockpit-merged.bin "dist/p4_cockpit-${VERSION}-${BOARD}-merged.bin"
          cp build/cockpit.bin     "dist/p4_cockpit-${VERSION}-${BOARD}-ota.bin"
          ls -l dist/

      - name: Upload build artifact
        if: env.RELEASE_TAG != '' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per board: two matrix legs uploading one name is an error on
          # upload-artifact v4+, and silently overwrote on v3.
          name: merged-firmware-${{ matrix.board }}
          path: dist/

    outputs:
      # A matrixed job's outputs are whichever leg wrote last, which is not
      # ordered. Both legs run the same signing step against the same secret,
      # so they always agree -- but the warning this drives is the one telling
      # an operator their release cannot ever take an OTA, so it must not
      # depend on a race. Every leg writes the same value; reading "the last
      # one" is therefore safe here, and stated so it is not mistaken for
      # per-leg data.
      unsigned: ${{ steps.signing.outputs.unsigned }}

  release:
    if: inputs.tag != '' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialise releases per repository, because the mirror step below pushes one
    # shared branch. This is an optimisation, NOT the safety guarantee: GitHub
    # keeps at most ONE pending job per group, so three releases published close
    # together mean the middle one is cancelled and attaches nothing -- and it
    # never reaches its rollback step, because its job never started. That tag
    # then needs re-running by hand (workflow_dispatch), which is safe to do
    # because the push itself leases against the tip it read.
    #
    # cancel-in-progress stays false: cancelling the RUNNING job mid-push is how
    # the branch ends up holding neither release.
    concurrency:
      group: release-assets-${{ github.repository }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Every board's leg, merged into one dist/ for a single release.
          pattern: merged-firmware-*
          merge-multiple: true
          path: dist
      # Say it where people download, not only in a CI log they will never
      # open: an unsigned build flashes over USB and then refuses every OTA.
      #
      # Prepended, not appended: action-gh-release only offers append (which
      # lands below the changelog, where a warning is least likely to be
      # read), so build the combined body here and overwrite. An empty
      # `body` is falsy in the action and leaves existing notes untouched,
      # which is what keeps the signed path unaffected.
      - name: Prepend the unsigned-build warning
        if: needs.build.outputs.unsigned == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Fail closed: on a transient API error an empty `existing` would
          # replace the release notes with nothing but the warning. Losing the
          # changelog is worse than failing the step, which can be re-run.
          if ! existing=$(gh release view "$TAG" --json body --jq .body 2>&1); then
            echo "::error::could not read the existing release body for $TAG:" \
                 "$existing"
            exit 1
          fi
          # Random delimiter: a release body is arbitrary user text, and a
          # fixed one appearing inside it would end the heredoc early and let
          # the rest be parsed as workflow commands.
          delim="RELEASE_BODY_$(openssl rand -hex 8)"
          {
            echo "body<<${delim}"
            echo '> [!WARNING]'
            echo '> **Unsigned build — USB flashing only.** Built without a signing'
            echo '> key (`COCKPIT_ALLOW_UNSIGNED_RELEASE`), so a device flashed with'
            echo '> it will reject every OTA update, including later releases from'
            echo '> this repository. Flash over USB, or set'
            echo '> `COCKPIT_SIGNING_KEY_PEM` and re-release. See espos/docs/ota.md.'
            echo ''
            printf '%s\n' "$existing"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: refuse a tag the mirror cannot lay out
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            "" )
              echo "::error::no tag to publish"; exit 1 ;;
            */* | . | .. | -* )
              echo "::error::tag '$TAG' cannot be a directory name on the" \
                   "release-assets branch. Use a flat tag such as v1.2.3."
              exit 1 ;;
          esac
          echo "tag '$TAG' is usable as a directory name"

          # And it must name a release that exists. The mirror runs before the
          # release step (so a release is never published without a
          # browser-readable copy), which means a mistyped workflow_dispatch tag
          # would otherwise mutate the shared branch -- and prune a real
          # release's images to make room -- for a release that was never going
          # to exist. On the `release:` trigger this is already true by
          # construction; the check costs one API call and covers the manual
          # path.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::no release '$TAG' in ${REPO}. Create the release" \
                 "first, or re-run for a tag that exists."
            exit 1
          fi
          echo "release '$TAG' exists"

      - name: refuse an image too large to mirror
        run: |
          set -euo pipefail
          for f in dist/*.bin; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 52428800 ]; then
              echo "::error::$(basename "$f") is $size bytes; too large to serve" \
                   "from raw.githubusercontent. The flasher would 404."
              exit 1
            fi
          done
          echo "all images are within the size raw.githubusercontent serves"

      # Publish the same images somewhere a BROWSER may read them.
      #
      # GitHub serves release downloads with no Access-Control-Allow-Origin, on
      # the 302 and on the redirect target, so a web page cannot fetch them at
      # all -- the hosted flasher could never download firmware from a release.
      # raw.githubusercontent does send `access-control-allow-origin: *` and
      # honours Range requests, so an orphan branch of this repository works as
      # a CORS-readable mirror of what the release already carries.
      #
      # The branch is a publishing surface, not history: it carries one
      # directory per tag and is rewritten as a single commit each time, so it
      # never accumulates history even though it keeps several releases.
      #
      # It KEEPS older tags rather than holding only the newest, because this
      # job can run for an old tag at any time -- `workflow_dispatch` takes a
      # tag -- and a run that published only its own tag would delete a newer
      # release's images. Publishing is therefore additive, and the oldest are
      # pruned below so the branch stays bounded.
      - name: mirror the images where a browser can read them
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          staged=$PWD/dist

          {
            echo "# Browser-readable firmware"
            echo
            echo "Generated by \`release-firmware.yml\`; do not edit or merge."
            echo
            echo "These are the same images attached to release \`$TAG\`,"
            echo "republished here because GitHub serves release downloads"
            echo "without the CORS header a web page needs to read them. The"
            echo "hosted flasher fetches them from raw.githubusercontent.com,"
            echo "which does send it."
            echo
            echo "Force-pushed on every release. Holds the newest few tags,"
            echo "the current one always among them; older directories are"
            echo "pruned. The releases themselves remain the archive, so"
            echo "firmware pruned from here is still downloadable from its"
            echo "release."
          } > "${RUNNER_TEMP}/release-assets-README.md"

          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          # Start from what the branch already holds, so this run adds its own
          # tag instead of replacing everyone else's. A missing branch (the
          # first release) is the only case where there is nothing to fetch.
          cd "$work"
          git init -q -b release-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tell "the branch does not exist yet" apart from "the fetch
          # failed". The first is the normal first release; the second means
          # force-pushing over content we could not read, which is how a
          # transient network or auth error deletes every other release's
          # images. Neither the fetch nor the checkout may fail quietly.
          # Only exit 2 means "no such branch"; 128 means the remote could not
          # be reached at all. Treating those alike is how an auth or network
          # failure force-pushes an empty branch over every release's images.
          set +e
          git ls-remote --exit-code --heads "$remote" release-assets >/dev/null 2>&1
          lsr=$?
          set -e
          case "$lsr" in
            0)
              echo "release-assets exists; restoring it before adding $TAG"
              git fetch -q --depth 1 "$remote" release-assets
              git checkout -q FETCH_HEAD -- .
              # The tip this run started from. The push below leases against it,
              # so a concurrent run that pushed in between is detected instead of
              # overwritten.
              base=$(git rev-parse FETCH_HEAD)
              echo "existing tags on the branch:"
              find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' \
                -printf '  %f\n' | sort -V
              # Keep the branch exactly as it was, so a later failure to attach
              # the release assets can put it back rather than leaving the
              # mirror advertising images the release does not have.
              snapshot="${RUNNER_TEMP}/release-assets-before"
              rm -rf "$snapshot"
              git clone -q --depth 1 --branch release-assets \
                "$remote" "$snapshot" 2>/dev/null \
                || echo "::warning::could not snapshot release-assets; no rollback will be possible"
              ;;
            2)
              echo "release-assets does not exist yet; creating it"
              # Record that there was nothing here before, so a rollback deletes
              # the branch this run creates rather than warning about a snapshot
              # that could never have existed.
              touch "${RUNNER_TEMP}/release-assets-was-absent"
              ;;
            *)
              echo "::error::could not reach ${REPO} to read release-assets" \
                   "(git ls-remote exited $lsr). Refusing to publish, because" \
                   "force-pushing now would delete the other releases' images."
              exit 1
              ;;
          esac

          # Re-stage this tag's images over whatever was there, so re-running a
          # release replaces its own directory and leaves the others alone.
          cp "${RUNNER_TEMP}/release-assets-README.md" ./README.md
          rm -rf -- "${TAG:?}"
          mkdir -p "$TAG"
          cp "$staged"/*.bin "$TAG/"

          # Keep the branch bounded: the newest KEEP tags by VERSION order (the
          # sort below), not by when they were published. Old firmware stays
          # downloadable
          # from its release; only the browser-readable copy is pruned.
          # Keep the newest KEEP, and ALWAYS keep the tag this run publishes.
          # Without that exception, re-publishing an old tag while KEEP newer
          # ones already exist prunes the directory just written, and the step
          # then reports success with URLs that 404. Reproduced with v0.1.0
          # behind five newer tags.
          #
          # Sorted by version, not lexically, or v0.10.0 would prune before
          # v0.6.0.
          # Lower than the gateway's 5 because a cockpit tag is much heavier: two
          # boards x (15 MB merged + 4.5 MB ota) is ~39 MB per tag, where a
          # gateway tag is a few MB. Three keeps the current release plus two to
          # roll back to, for ~117 MB, and the releases remain the archive --
          # only the browser-readable copy is pruned.
          #
          # Both kinds are mirrored even though the web flasher reads only
          # mergedWebUrl: the index derives otaWebUrl by rewriting the URL
          # without checking the file is there, so mirroring merged alone would
          # publish an otaWebUrl that 404s.
          KEEP=3
          mapfile -t others < <(
            find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' \
              | grep -Fxv -- "$TAG" | sort -rV
          )
          # One slot belongs to $TAG, so keep KEEP-1 of the others.
          for old in "${others[@]:$((KEEP - 1))}"; do
            echo "pruning $old"
            rm -rf -- "$old"
          done

          # One commit, no history: the push replaces the branch wholesale, and
          # what it contains is everything above rather than this tag alone.
          #
          # --force-with-lease, not --force: the concurrency group above keeps two
          # runs from pushing at once, but it is not a guarantee. GitHub holds at
          # most ONE pending job per group, so a third release entering the queue
          # cancels the second -- which would then attach nothing and never reach
          # the rollback step, because its job never started. Anyone re-running
          # that tag by hand is then racing whatever has published since. The
          # lease makes the push itself safe: if the branch moved under us the
          # push is rejected rather than silently discarding the other run's tag,
          # and we redo the whole fetch/stage/prune from the new tip.
          stage_and_push() {
            git add -A
            git commit -q -m "firmware for $TAG"
            if [ -n "${base:-}" ]; then
              git push -q --force-with-lease="release-assets:${base}" \
                "$remote" HEAD:release-assets
            else
              # First publish. An empty lease means "expect the branch not to
              # exist", so a branch created meanwhile is a rejection rather than
              # something this run flattens.
              git push -q --force-with-lease="release-assets:" \
                "$remote" HEAD:release-assets
            fi
          }

          attempt=1
          until stage_and_push; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::release-assets moved under this run 3 times;" \
                   "giving up rather than discarding another release's images."
              exit 1
            fi
            echo "::warning::release-assets moved since this run read it" \
                 "(attempt $attempt); re-reading and re-staging."
            attempt=$((attempt + 1))
            # Start over from the new tip. Discard this run's commit entirely
            # rather than reset --soft HEAD~1: on the first attempt the commit
            # has no parent, so HEAD~1 does not resolve and the command errors
            # (harmlessly, but it looks like a real failure in the log). An
            # orphan branch has no history worth keeping here -- the push is a
            # wholesale replacement either way.
            git checkout -q --orphan rebuild
            git rm -rq --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
            git fetch -q --depth 1 "$remote" release-assets
            git checkout -q FETCH_HEAD -- .
            base=$(git rev-parse FETCH_HEAD)
            cp "${RUNNER_TEMP}/release-assets-README.md" ./README.md
            rm -rf -- "${TAG:?}"
            mkdir -p "$TAG"
            cp "$staged"/*.bin "$TAG/"
            mapfile -t others < <(
              find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' \
                | grep -Fxv -- "$TAG" | sort -rV
            )
            for old in "${others[@]:$((KEEP - 1))}"; do
              echo "pruning $old"
              rm -rf -- "$old"
            done
          done

          echo "published $TAG to the release-assets branch:"
          for f in "$TAG"/*.bin; do
            echo "  https://raw.githubusercontent.com/${REPO}/release-assets/${TAG}/$(basename "$f")"
          done

      # If attaching the assets fails after the mirror has published, the
      # branch advertises images for a release that has none. Roll the mirror
      # back to what it held before this run, so the two never disagree.
      #
      # Only ever on failure, and only for this tag: it re-pushes the snapshot
      # taken before the mirror step, which is why that step records one.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Named explicitly: on a workflow_call there is no release event.
          tag_name: ${{ env.RELEASE_TAG }}
          # Fail rather than publish a release missing a chip's firmware: a
          # silently incomplete release is worse than a failed one, because the
          # registry would index it and offer owners of that chip nothing.
          fail_on_unmatched_files: true
          files: dist/*.bin
          body: ${{ steps.notes.outputs.body }}

      # Any failure after the mirror pushed, not only a failed attach. The
      # narrower `steps.attach.outcome == 'failure'` missed the case it most
      # needed to catch: if the mirror step pushes and then fails on a later
      # line, `attach` is SKIPPED rather than failed, so the branch was left
      # advertising a tag whose release has no assets -- exactly the state this
      # step exists to undo.
      #
      # Safe to widen because this is the last step and the restore is guarded:
      # a failure before the mirror ran leaves neither snapshot nor
      # was-absent marker, so it warns and exits 0 without touching anything.
      - name: roll the mirror back if anything after it failed
        if: failure()
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          snapshot="${RUNNER_TEMP}/release-assets-before"

          # The branch did not exist before this run, so "restoring" it means
          # removing what this run created.
          if [ -f "${RUNNER_TEMP}/release-assets-was-absent" ]; then
            echo "release-assets did not exist before this run; deleting it"
            git push -q --delete "$remote" release-assets \
              || echo "::warning::could not delete release-assets"
            exit 0
          fi

          if [ ! -d "$snapshot/.git" ]; then
            echo "::warning::no pre-mirror snapshot to restore; the" \
                 "release-assets branch may advertise $TAG with no assets" \
                 "attached to the release."
            exit 0
          fi
          cd "$snapshot"
          git push -q --force "$remote" release-assets
          echo "release-assets restored to its state before this run"
