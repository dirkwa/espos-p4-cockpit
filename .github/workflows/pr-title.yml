# The changelog is generated from pull request titles (release-please, see
# release-please.yml), so a title that is not a Conventional Commit is a
# change that never appears in the notes. Same check as espOS.
#
# pull_request, not pull_request_target: the check only reads the title, which
# the read-only token a fork's pull request gets is enough for, and from
# 2026-11-02 GitHub blocks pull_request_target on public repositories by
# default.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          # Only a capital first letter is rejected: a subject may start with
          # a digit ("10.1-inch panel") or a symbol, and the pattern says so.
          subjectPatternError: >-
            The subject "{subject}" must not start with a capital letter, e.g.
            "feat(arc): tick labels". The title becomes the changelog entry.
