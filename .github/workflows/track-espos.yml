# Follows espOS releases. When espOS cuts vX.Y.Z, this opens a PR that moves
# the `espos` submodule to that tag and regenerates dependencies.lock, so the
# panel firmware picks up espOS fixes without anyone having to notice a release.
#
# It opens the PR and stops there. A submodule bump changes the binary that goes
# on a boat, so a human merges it after the PR's firmware build is green and,
# where it matters, after flashing that build's artifact to a panel. Merging
# makes release-please propose the next cockpit release as usual.
#
# A bump is USUALLY mechanical, and sometimes is not: a breaking espOS release
# can pin a shared registry component against this project's own pin, and then
# the lock cannot be solved until this project changes too (#154 -- espOS
# v0.14.0 and esp_hosted). That case still opens a PR, titled so it cannot be
# skimmed as routine, with the lock left unchanged, no firmware dispatched, and
# the reason at the top of the body. Opening it is the point: the PR is the
# branch the work happens on, its own checks reproduce the failure, and because
# the target step skips once a PR exists for the tag, the nightly schedule stops
# re-reporting it.
#
# A submodule never moves on its own, and Dependabot's gitsubmodule ecosystem is
# no substitute: it follows the tip of espOS main rather than release tags, and
# never touches dependencies.lock, which carries a version for every espOS
# component and moves on every bump.
#
# The PR is opened with a GitHub App's token (RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY), because GitHub holds the checks of a PR opened with
# the workflow token until a maintainer approves them, while an App's PR runs them
# at once. Without those secrets -- a fork, say -- it falls back to the workflow
# token and those checks wait for the approval.
#
# Separately, and on both paths, the firmware build is dispatched on the tracking
# branch. Two runs of the same build is not an oversight: the dispatched one is the
# only one ELIGIBLE for the release signing key (release-firmware.yml -- whether it
# actually gets one depends on COCKPIT_SIGNING_KEY_PEM being set), because a
# `pull_request` build must never hold a key whose loss would stop every panel
# already flashed with it from taking an OTA -- and a same-repository PR does get
# secrets. So the PR's checks answer "does it build" and the dispatched run
# produces the image to flash. Take artifacts from the dispatched run, and read its
# signing warning if there is one.
name: Track espOS releases

# One run at a time: a scheduled and a manual run overlapping could both see no
# tracking branch and race to push one.
concurrency:
  group: track-espos
  cancel-in-progress: false

on:
  schedule:
    # Daily. espOS lives in another organisation, so it cannot notify this
    # repository without a cross-org token; a day's delay costs nothing.
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "espOS tag to move to (default: the latest release)"
        required: false

jobs:
  track:
    runs-on: ubuntu-latest
    # On the job rather than the workflow, so a second job added here starts with
    # nothing and has to ask. All three together because a job-level block
    # REPLACES the workflow-level one -- listing only `actions` here would quietly
    # take away the write access this job needs to push the branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
      # To dispatch release-firmware.yml: that run is the only one eligible for the
      # signing key, so it is the only one whose artifact can go on a panel.
      actions: write
    env:
      # A flag, because a step's `if` cannot read secrets. Only the flag: the
      # key itself in the job environment would reach every step.
      APP_CONFIGURED: >-
        ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # fetch-depth: 0 so the submodule has its history: whether the release is
      # newer than the pin is answered by ancestry, which needs both commits.
      # No persisted credentials: the IDF step below runs a third-party
      # container over this workspace, and a token in .git/config would hand it
      # write access to the repository. The push passes the token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Determine the espOS release to track
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          EXPLICIT=yes
          if [ -z "$TAG" ]; then
            EXPLICIT=no
            # releases/latest skips prereleases and drafts: a panel follows
            # stable espOS only. A prerelease can still be taken by naming it.
            TAG=$(gh api repos/signalk-espOS/espOS/releases/latest --jq .tag_name)
          fi
          # Anchored: a case glob's `*` also matches `/`, `^` and `..`, and the
          # tag becomes part of a branch name and a revision expression below.
          # The prerelease suffix is reachable only by naming a tag by hand.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git -C espos fetch --quiet --tags origin
          PINNED=$(git rev-parse HEAD:espos)
          TARGET=$(git -C espos rev-parse "$TAG^{commit}")
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"

          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$PINNED" = "$TARGET" ]; then
            skip "Already pinned to $TAG ($TARGET)."
          fi
          # Closed counts too, and is looked up by head name rather than by
          # branch: a declined bump is not reopened daily, even after its
          # branch was deleted along with the PR. Only PRs from this repository
          # count: a fork's branch of the same name is not this workflow's.
          # --limit before the filter: gh returns 30 by default, and a match
          # past that would read as "no PR" and reopen a declined bump.
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "track-espos-$TAG" \
                  --state all --limit 1000 --json number,isCrossRepository \
                  --jq 'map(select(.isCrossRepository == false)) | length')
          if [ "$PRS" -gt 0 ]; then
            skip "track-espos-$TAG already has a PR."
          fi
          if git ls-remote --exit-code --heads origin "track-espos-$TAG" >/dev/null; then
            # A branch with no PR is what a run that failed after its push
            # leaves behind. Nobody can have reviewed it, and skipping on it
            # would stall this release for good, so start over.
            echo "Removing track-espos-$TAG, left without a PR by an earlier run."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/track-espos-$TAG"
          fi
          # Never move backwards, or sideways, on its own: the pin may sit ahead
          # of the newest release on a commit from espOS main. Ancestry rather
          # than dates, because a tag's date says nothing about what it
          # contains. A tag named by hand bypasses this, so a deliberate
          # rollback stays possible.
          if [ "$EXPLICIT" = no ] && ! git -C espos merge-base --is-ancestor "$PINNED" "$TARGET"; then
            skip "$TAG does not contain the pinned espOS commit $PINNED; not moving automatically."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Move the submodule
        id: bump
        if: steps.target.outputs.skip == 'false'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          OLD_IDF=$(cat .idf-version)
          git -C espos checkout --quiet "$TAG"
          NEW_IDF=$(cat espos/.idf-version)
          # espOS's prologue refuses to configure when the two disagree, and CI
          # reads .idf-version with no fallback: bump it, never delete it.
          if [ "$OLD_IDF" != "$NEW_IDF" ]; then
            printf '%s\n' "$NEW_IDF" > .idf-version
            # The IDF version is also written out by hand in a few places.
            # They do not break the build, so they are listed for the reviewer
            # rather than rewritten blindly.
            STALE=$(grep -nF -- "${OLD_IDF#v}" CMakeLists.txt README.md AGENTS.md || true)
            {
              echo "idf_moved=true"
              echo "old_idf=$OLD_IDF"
              echo "new_idf=$NEW_IDF"
              echo "stale<<EOF"
              echo "$STALE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "idf_moved=false" >> "$GITHUB_OUTPUT"
          fi
          echo "idf=$NEW_IDF" >> "$GITHUB_OUTPUT"

      # Re-resolves the lock against the new espOS manifests. Every espOS
      # component carries its own version and ^X.Y.Z inter-dependencies, so the
      # lock cannot be patched by hand. reconfigure rather than
      # update-dependencies: the latter would also take every newer registry
      # component the ranges allow, which is dependency-drift.yml's job.
      #
      # continue-on-error, because this failing is INFORMATION, not an accident.
      # A breaking espOS release can make the bump un-solvable until this
      # project changes with it -- espOS v0.14.0 pinned esp_hosted ==3.0.9 while
      # main still pinned ==2.12.12, and the solver refused (#154). Letting that
      # end the job meant no PR, no issue and no branch: the one thing the run
      # learned stayed in a log, and the nightly schedule went red until someone
      # did the work by hand. The steps below carry the outcome into the PR
      # instead, so the human gate this workflow is built around -- the PR's own
      # firmware build -- actually gets to fire.
      #
      # `outcome` says THAT it failed, never why: a solver refusal, a registry
      # that was unreachable and a container that would not pull all land here
      # alike. So nothing downstream asserts a cause -- it reports the failure,
      # points at this step's log, and gives the branch for each case. Claiming
      # "needs changes in this project" on what was really a network flake would
      # send someone editing pins to fix a retry.
      - name: Regenerate dependencies.lock
        id: lock
        continue-on-error: true
        if: steps.target.outputs.skip == 'false'
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1 branch head
        with:
          esp_idf_version: ${{ steps.bump.outputs.idf }}
          target: esp32p4
          command: idf.py reconfigure

      # A changed espOS manifest makes the component manager solve again, and a
      # new solve can also move registry components that espOS does not own
      # (esp-dl, for one, moved with espOS v0.11.0). That is not wrong, but it
      # changes the binary beyond espOS, so the PR names it for the reviewer.
      - name: Name lock changes outside espOS
        id: drift
        if: steps.target.outputs.skip == 'false' && steps.lock.outcome == 'success'
        run: |
          set -euo pipefail
          git show HEAD:dependencies.lock > "$RUNNER_TEMP/lock.old"
          python3 - "$RUNNER_TEMP/lock.old" dependencies.lock <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys

          # Same shape as dependency-drift.yml parses: a component key at two
          # spaces, its own fields at four. Deeper `version:` lines are
          # dependency requirements and are left out.
          KEY = re.compile(r"^  ([A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?):\s*$")
          FIELD = re.compile(r"^    (version|component_hash):\s*(.+?)\s*$")
          OUTDENT = re.compile(r"^ {0,2}\S")

          def deps(path):
              out, cur, started = {}, None, False
              for line in open(path):
                  line = line.rstrip("\n")
                  if line.startswith("dependencies:"):
                      started = True
                      continue
                  if not started:
                      continue
                  if line and not line.startswith(" "):
                      break
                  m = KEY.match(line)
                  if m:
                      cur = m.group(1)
                      out.setdefault(cur, {})
                      continue
                  m = FIELD.match(line)
                  if m and cur:
                      out[cur][m.group(1)] = m.group(2).strip("'\"")
                      continue
                  if line.strip() and OUTDENT.match(line):
                      cur = None
              return out

          old, new = deps(sys.argv[1]), deps(sys.argv[2])
          lines = []
          for k in sorted(set(old) | set(new)):
              if k.startswith("signalk-espos/"):
                  continue
              o, n = old.get(k), new.get(k)
              if o is None:
                  lines.append(f"+ {k} {n.get('version', '?')}")
              elif n is None:
                  lines.append(f"- {k} {o.get('version', '?')}")
              elif o.get("version") != n.get("version"):
                  lines.append(f"~ {k} {o.get('version', '?')} -> {n.get('version', '?')}")
              elif o.get("component_hash") != n.get("component_hash"):
                  lines.append(f"! {k} {n.get('version', '?')} republished")
          print("changed<<EOF")
          print("\n".join(lines))
          print("EOF")
          PY

      # Created only now: the token lives an hour, and the steps above take a
      # few minutes of that.
      - name: Get the App token for the PR
        id: app-token
        if: steps.target.outputs.skip == 'false' && env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the tracking PR
        if: steps.target.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # The dispatch below needs `actions: write`, which the App token is not
          # minted with -- it exists to author the PR. Named separately so the two
          # uses cannot be confused: GH_TOKEN pushes and opens the PR, this one
          # starts the build.
          WORKFLOW_TOKEN: ${{ github.token }}
          AS_APP: ${{ steps.app-token.outputs.token != '' }}
          # Whether the dispatched build can sign. A flag, not the key: what the
          # body may promise depends on this, and promising a release-signed image
          # that turns out to be throwaway-signed is how a panel gets stranded.
          SIGNED: ${{ secrets.COCKPIT_SIGNING_KEY_PEM != '' }}
          TAG: ${{ steps.target.outputs.tag }}
          PINNED: ${{ steps.target.outputs.pinned }}
          IDF_MOVED: ${{ steps.bump.outputs.idf_moved }}
          OLD_IDF: ${{ steps.bump.outputs.old_idf }}
          NEW_IDF: ${{ steps.bump.outputs.new_idf }}
          STALE: ${{ steps.bump.outputs.stale }}
          DRIFT: ${{ steps.drift.outputs.changed }}
          # 'success' or 'failure'. Decides whether this is a routine bump or a
          # bump that needs code beside it.
          LOCK: ${{ steps.lock.outcome }}
        run: |
          set -euo pipefail
          BRANCH="track-espos-$TAG"
          OLD_DESC=$(git -C espos describe --tags "$PINNED" 2>/dev/null || echo "${PINNED:0:7}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Named paths only: reconfigure leaves sdkconfig, build/ and a
          # throwaway signing key behind, all ignored, and none belong here.
          if [ "$LOCK" = success ]; then
            git add espos dependencies.lock .idf-version
            LOCK_NOTE="and regenerates dependencies.lock"
          else
            # A failed solve may have left the lock half-written, and a stale or
            # partial lock beside a moved submodule is a worse starting point
            # than an honestly unchanged one. Restore it and say so.
            git checkout --quiet -- dependencies.lock
            git add espos .idf-version
            LOCK_NOTE="WITHOUT regenerating dependencies.lock, which could not be solved"
          fi
          # fix: so release-please cuts a patch release once this merges. Left
          # alone in the failed case too: whoever finishes the work decides what
          # the release is, and their own commits carry it.
          git commit --quiet -m "fix: bump espOS to $TAG" \
            -m "Moves the espos submodule from $OLD_DESC to $TAG $LOCK_NOTE."
          git push --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"

          # Before the PR, not after, and that order is the whole point. The target
          # step sets skip=true once a PR exists for this tag, so every later run
          # stops early -- which means a dispatch that failed after the PR was
          # created would never be retried, and the bump would sit there with no
          # image to flash and nothing to fix it but a manual dispatch. Failing here
          # instead leaves no PR, so the next run does all of it again.
          #
          # Always, both paths: this run is the only one eligible for the signing
          # key, because a `pull_request` build must never hold a key whose loss
          # would stop every panel already flashed with it from taking an OTA, and a
          # same-repository PR does get secrets. The PR's own checks answer "does it
          # build"; this run produces the image that goes on a panel. So a bump
          # builds twice where the App is configured -- CI minutes, not anything a
          # boat notices.
          # Skipped when the solve failed: that build cannot get past configure
          # either, so dispatching it only spends CI minutes and adds a second
          # red run to read. The body tells the reader to dispatch it once the
          # branch builds.
          if [ "$LOCK" = success ]; then
            GH_TOKEN="$WORKFLOW_TOKEN" \
              gh workflow run release-firmware.yml --ref "$BRANCH"
          fi

          # Built as a file, never interpolated into a shell string: the drift
          # list and the stale lines are text from files in the tree.
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Moves espOS from \`$OLD_DESC\` to [\`$TAG\`](https://github.com/signalk-espOS/espOS/releases/tag/$TAG)."
            echo
            if [ "$LOCK" != success ]; then
              echo "> [!IMPORTANT]"
              echo "> **\`dependencies.lock\` was not regenerated, so this is not mergeable as it stands.**"
              echo ">"
              echo "> \`idf.py reconfigure\` failed. The lock here is **unchanged** from \`main\` and no"
              echo "> firmware was dispatched. Read the **Regenerate dependencies.lock** step of the"
              echo "> [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for the reason, because this workflow cannot tell"
              echo "> the two apart:"
              echo ">"
              echo "> - **\`Version solving failed\`** -- the espOS release pins a shared registry"
              echo ">   component against this project's own pin in \`main/idf_component.yml\`. The"
              echo ">   solver refusing rather than quietly picking one is the behaviour you want."
              echo ">   Fix this project's side on this branch, re-run \`idf.py reconfigure\`, and"
              echo ">   commit the lock with it."
              echo "> - **anything else** (registry unreachable, container pull, runner) -- nothing is"
              echo ">   wrong with the bump. Close this PR and let the next scheduled run re-open"
              echo ">   it, or push an empty commit to re-run the checks."
              echo ">"
              echo "> Either way, dispatch \`release-firmware.yml\` on \`$BRANCH\` once it builds:"
              echo "> that run, not this PR's checks, produces the image to flash."
              echo
            fi
            echo "Read the espOS release notes for anything marked **BREAKING**: the build proves the firmware compiles, not that it behaves the same."
            echo
            if [ "$IDF_MOVED" = true ]; then
              echo "### ESP-IDF moved: $OLD_IDF → $NEW_IDF"
              echo
              echo "\`.idf-version\` is bumped. These lines still name the old version and are left for you to update:"
              echo
              echo '```'
              echo "${STALE:-(none found)}"
              echo '```'
              echo
              echo "An IDF move can grow the bootloader, and the P4 bootloader has almost no room left below 0x6000. Check its size in the build log."
              echo
            fi
            if [ -n "${DRIFT//[[:space:]]/}" ]; then
              echo "### Lock changes outside espOS"
              echo
              echo "Re-resolving against the new espOS manifests also moved these. Review them before merging:"
              echo
              echo '```diff'
              echo "$DRIFT"
              echo '```'
              echo
            fi
            echo "### Checks"
            echo
            if [ "$AS_APP" = true ]; then
              echo "This PR's own checks build the firmware for both panels, which proves it compiles."
            else
              echo "Opened with the workflow token, so GitHub holds this PR's own checks until a maintainer approves them (**Approve workflows to run**)."
            fi
            echo
            # Nothing was dispatched when the solve failed, so do not promise a
            # run that does not exist -- running this block both ways is what
            # caught that.
            if [ "$LOCK" != success ]; then
              echo "No firmware was dispatched: the branch does not configure, so the build could not get past CMake. Dispatch \`release-firmware.yml\` on \`$BRANCH\` yourself once it builds -- that run, not this PR's checks, is the one that produces an image to flash."
            elif [ "$SIGNED" = true ]; then
              echo "Separately, the firmware build is dispatched on this branch, and **that** is the run to take images from: each board's dispatched run uploads \`merged-firmware-<board>\`, signed with the release key, so a panel you flash with one still accepts OTAs afterwards."
            else
              echo "Separately, the firmware build is dispatched on this branch, and that is the run that uploads \`merged-firmware-<board>\`. **\`COCKPIT_SIGNING_KEY_PEM\` is not set in this repository**, so those images carry a key generated inside the run and thrown away with it: one boots over USB and then rejects every OTA for the life of that panel. Check the dispatched run's signing warning before flashing anything."
            fi
            echo
            echo "Images from a \`pull_request\` build are deliberately not published -- a PR build is never given the signing key."
            echo
            echo "Opened by \`.github/workflows/track-espos.yml\` ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
          } > "$BODY"

          # Conventional-Commit type either way, so pr-title.yml passes; the
          # suffix exists so a bump needing hand-work cannot be skimmed as
          # routine. It states the fact -- the lock was not regenerated -- and
          # not a cause, which this workflow cannot know. No `!` either: whether
          # the eventual release is breaking is for whoever finishes the work.
          if [ "$LOCK" = success ]; then
            TITLE="fix: bump espOS to $TAG"
          else
            TITLE="fix: bump espOS to $TAG -- dependencies.lock not regenerated"
          fi
          gh pr create --head "$BRANCH" --base main \
            --title "$TITLE" --body-file "$BODY"
