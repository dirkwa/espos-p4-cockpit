; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = p4_cockpit
; Optional local overrides — WiFi credentials, SK host, a personal wake word.
; platformio_local.ini is gitignored: keep boat config there, never in this
; file. `strings` on a firmware image prints every compiled-in string, and the
; merged binary is a public release asset. See platformio_local.ini.example.
extra_configs = platformio_local.ini

; Shared config for every board target. Board-specific envs extend this
; and add only their own -D board flag; keep the toolchain, deps, and
; queue tuning here so there's a single source of truth.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = espidf, arduino
board = esp32-p4
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = p4_16mb.csv
upload_speed = 2000000
upload_port = /dev/ttyACM0
monitor_speed = 115200
monitor_port = /dev/ttyACM0
build_unflags = -Werror=reorder
board_build.filesystem = spiffs
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D USE_ESP_IDF_LOG
	-D SENSESP_SSL_SUPPORT=1
	-DBOARD_HAS_PSRAM
	-D LV_CONF_INCLUDE_SIMPLE
	-I ../sensesp-cockpit-display
	-D GATEWAY_HOSTNAME='"p4-cockpit"'
	; Deeper WS received-update queues than the SensESP default (20).
	; SK's post-reconnect burst republishes dozens of values+meta in one
	; ms; upstream now budgets meta and value caps independently so a
	; meta burst can't evict pending values. 100 each rides the burst.
	-D SENSESP_MAX_RECEIVED_VALUE_UPDATES=100
	-D SENSESP_MAX_RECEIVED_META_UPDATES=100
lib_ldf_mode = deep

extra_scripts = pre:scripts/strip_lvgl_helium.py

lib_deps =
	# SKPrefixListener (the wildcard path-family listener the notifications
	# registry needs) + the subscription-dedupe fix landed upstream in
	# 3.5.0 (PRs #1048/#1049), so the local fork is retired — pin the
	# release directly. Named explicitly as 'SensESP' so it overrides the
	# transitive 'SignalK/SensESP>=3.3.0' pulled in by the sister libs.
	SensESP=SignalK/SensESP@^3.5.0
	symlink://../sensesp-cockpit-display
	symlink://../sensesp-n2k-gateway
	symlink://../sensesp-ble-gateway
	symlink://../sensesp-wyoming-satellite
	lvgl/lvgl@^9.2
	esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B — 1024x600 EK79007, onboard N2K
; gateway. The default target.
[env:p4_cockpit]
extends = common

; Same board, but wake runs on signalk-openwakeword over the network instead
; of on-device WakeNet — so the wake word can be any custom-trained model
; without reflashing the "model" partition. Build with `-e p4_cockpit_netwake`.
[env:p4_cockpit_netwake]
extends = common
build_flags =
	${common.build_flags}
	-D JLP_NETWORK_WAKE
	; Empty host = use the SignalK server the panel is already configured
	; for (SensESP config UI), so a release build carries no boat address.
	; Override for a personal build:
	;   pio run -e p4_cockpit_netwake -D JLP_NETWORK_WAKE_HOST='\"10.0.0.5\"'
	-D JLP_NETWORK_WAKE_HOST='""'
	-D JLP_NETWORK_WAKE_WORD='"okay_nabu"'

; Waveshare ESP32-P4-WIFI6-Touch-LCD-4B — 720x720 ST7703, no CAN
; transceiver (N2K gateway compiles out). COCKPIT_BOARD_4B switches the
; board HAL in main.cpp and drops the gateway.
;
; DISABLED: no 4B board on hand to test against, so the env is commented
; out to keep it from being built/shipped unverified. Re-enable by
; uncommenting the [env:p4_cockpit_4b] block below, then build/flash with
; `-e p4_cockpit_4b`. Keep this env building green once a board is
; available again.
; [env:p4_cockpit_4b]
; extends = common
; build_flags =
; 	${common.build_flags}
; 	-D COCKPIT_BOARD_4B
