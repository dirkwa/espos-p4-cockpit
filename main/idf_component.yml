## The ESP32-P4 has no radio of its own: WiFi is an ESP32-C6 co-processor over
## SDIO (esp_hosted) behind the esp_wifi_remote shim. Neither is named here --
## espos_wifi declares and pins both, and this firmware calls neither. A copy
## could only disagree, and two exact pins that differ are a hard version
## solving failure, not a warning.
dependencies:
  idf: ">=6.0.0"
  bblanchon/arduinojson: "^7.4.0"
  espressif/esp_new_jpeg: "^1.0.0"
